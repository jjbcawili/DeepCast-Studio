name: TTS Dependency Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tts-smoke.yml'
      - 'tts-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tts-worker/requirements.txt
      - name: Install DeepCast TTS dependencies
        run: python -m pip install --disable-pip-version-check -r tts-worker/requirements.txt
      - name: Verify Chatterbox Nano and Turbo API surface
        run: |
          python - <<'PY'
          import inspect
          import torch
          from chatterbox.tts_turbo import ChatterboxTurboTTS
          from kokoro import KPipeline

          loader = inspect.signature(ChatterboxTurboTTS.from_pretrained)
          generator = inspect.signature(ChatterboxTurboTTS.generate)
          assert 'nano' in loader.parameters, f'Installed Chatterbox package does not expose nano= in from_pretrained: {loader}'
          assert 'audio_prompt_path' in generator.parameters, f'Installed Chatterbox package does not expose audio_prompt_path in generate: {generator}'
          print('Chatterbox loader:', loader)
          print('Chatterbox generator:', generator)
          print('Torch:', torch.__version__)
          print('Kokoro fallback import: OK')
          print('DeepCast TTS dependency smoke test: PASS')
          PY
