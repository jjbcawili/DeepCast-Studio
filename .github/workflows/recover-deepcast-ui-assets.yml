name: Recover DeepCast UI Assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[asset-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover current deployment title art
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          base="https://deepcast-studio.jjbcawili.chatgpt.site/assets"
          for asset in DeepCast_Projects_Title_Transparent_4K.webp DeepCast_Workspace_Title_Transparent_4K.webp; do
            curl --fail --location --retry 3 --retry-all-errors \
              --user-agent "DeepCast-Studio-GitHub-Recovery/1.0" \
              "$base/$asset" -o "public/assets/$asset"
            test -s "public/assets/$asset"
          done
      - name: Commit recovered deployment assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recover-deepcast-ui-assets.yml
          git config user.name "jjbcawili"
          git config user.email "jeweljeremybernardc@yahoo.com"
          git add public/assets .github/workflows/recover-deepcast-ui-assets.yml
          git commit -m "Recover approved Projects and Workspace title art [asset-sync]"
          git push
